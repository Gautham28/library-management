# Active with: --spring.profiles.active=prod
# Never commit real production secrets — use environment variables.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.library.management: INFO
    org.hibernate.SQL: WARN
